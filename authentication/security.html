<!DOCTYPE html>
<html lang="en"></html>
<head>
    <meta charset="UTF-8">
    <meta name=" 'viewport' content= 'width-device-width, initial-scale-1.0">

    <title>STEMMATE security</title>

    <link rel="stylesheet" href="security.css">
</head>

<body> 
    <main class="'container">
     <h1>STEMMate Namibia</h1>

        <p>Secure access to your saved work.</p>

        <section id="loginSection">

            <h2>PIN Security</h2>

            <label for="pinInput">Enter your PIN</label>

            <input
                type="password"
                id="pinInput"
                inputmode="numeric"
                maxlength="8"
                placeholder="Enter your PIN"
            >

            <button id="createPinButton">
                Create PIN
            </button>

            <button id="signInButton">
                Sign In
            </button>

            <p id="message"></p>

        </section>

        <section id="dashboard" hidden>

            <h2>Welcome to STEMMate!</h2>

            <p>You have successfully signed in.</p>

            <label for="workInput">Your saved work</label>

            <textarea
                id="workInput"
                placeholder="Enter your work here..."
            ></textarea>

            <button id="saveButton">
                Save Work
            </button>

            <button id="signOutButton">
                Sign Out
            </button>

        </section>

    </main>

    <script src="authentication.js"></script>
  |
</body>
